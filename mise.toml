[tools]
go = "1.27.3"
"github:temporalio/cli" = "1.10.0"
ollama = "0.40.15"
node = "24.21.0"
pnpm = "12.18.0"
python = "3.12.16"

[tasks.setup]
description = "Install pinned dependencies, build fresh assets/helper, ensure exact models; leave no newly owned services running"
run = "bash scripts/dev/setup.sh"

[tasks.up]
description = "Background the owned local web-chat stack and verify readiness"
run = "bash scripts/dev/up.sh"

[tasks.down]
description = "Stop verified owned services; preserve all data/models and accepted workflow work"
run = "bash scripts/dev/down.sh"

[tasks.test]
run = "go test -p 1 ./..."

[tasks.lint]
run = "go vet ./..."

[tasks."web:build"]
description = "Internal frontend-only build; use setup for fresh production assets"
run = "pnpm --dir web build"

[tasks."web:qualify"]
description = "Opt-in live probes; known Qwen failures remain recorded, never ignored"
run = "go run ./scripts/qualify-chat-models.go"
