[tools]
go = "1.27.3"
"github:temporalio/cli" = "1.10.0" # `temporal` shorthand points to the server, not CLI.
ollama = "0.40.15"
node = "24.21.0"
pnpm = "12.18.0"

[env]
HARNESS_MODEL = "{{ env.HARNESS_MODEL | default(value='gemma4:e4b') }}"
TEMPORAL_ADDRESS = "{{ env.TEMPORAL_ADDRESS | default(value='localhost:7233') }}"
OLLAMA_HOST = "{{ env.OLLAMA_HOST | default(value='127.0.0.1:11434') }}"

[tasks.setup]
description = "Legacy CLI setup (not the new web-chat lifecycle): install tools, build, start dependencies, pull model"
run = ["mise install", "ollama --version", "go mod download", "go build -o bin/harness ./cmd/harness", "./bin/harness doctor --fix"]

[tasks.demo]
run = "./bin/harness demo"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "go vet ./..."

# Temporary Task 1 commands. Full setup/up/down ownership arrives in Task 13.
[tasks."web:build"]
description = "Task 1 shell only; does not start services"
run = "pnpm --dir web build"

[tasks."web:qualify"]
description = "Opt-in live probes of both exact models on shared loopback Ollama"
run = "go run ./scripts/qualify-chat-models.go"
