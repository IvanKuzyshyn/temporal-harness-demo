# Internal Docker dependencies. Public lifecycle: mise run setup|up|down.
# Host processes and exact ownership are managed by scripts/dev/.
name: webchat-local
# Host API/worker use the SAME absolute directory (lifecycle exports this mapping).
# This bind storage is deliberately outside Docker container writable layers;
# compose down cannot remove original bytes. Never point it at legacy .data.
x-webchat-host-environment:
  WEBCHAT_ATTACHMENT_ROOT: ${WEBCHAT_ATTACHMENT_ROOT:-${PWD}/.webchat/attachments}
services:
  attachment-parser:
    profiles: ["tools"]
    image: webchat-attachment-parser:1
    build: ./infra/attachment-parser
    network_mode: none
    read_only: true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    # Go creates one isolated stdin-only container per validation/extraction.
    # No upload directory is mounted into the parser.
  postgres:
    image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${WEBCHAT_POSTGRES_PASSWORD:-local-admin-only}
      WEBCHAT_DB_PASSWORD: ${WEBCHAT_DB_PASSWORD:-local-webchat-only}
      WEBCHAT_TEMPORAL_DB_PASSWORD: ${WEBCHAT_TEMPORAL_DB_PASSWORD:-local-temporal-only}
    ports:
      - "127.0.0.1:${WEBCHAT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-webchat.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  temporal-schema:
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${WEBCHAT_TEMPORAL_DB_PASSWORD:-local-temporal-only}
    entrypoint: ["/bin/sh", "/init-schema.sh"]
    volumes:
      - ./infra/temporal-schema.sh:/init-schema.sh:ro
    mem_limit: 256m

  temporal:
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      TEMPORAL_SERVER_CONFIG_FILE_PATH: /etc/temporal/webchat.yaml
      TEMPORAL_ALLOW_NO_AUTH: "true"
      WEBCHAT_TEMPORAL_DB_PASSWORD: ${WEBCHAT_TEMPORAL_DB_PASSWORD:-local-temporal-only}
      BIND_ON_IP: 0.0.0.0
    ports:
      - "127.0.0.1:${WEBCHAT_TEMPORAL_PORT:-17233}:7233"
    volumes:
      - ./infra/temporal.yaml:/etc/temporal/webchat.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7243/api/v1/system-info"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    mem_limit: 1536m
    restart: unless-stopped

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - temporal operator namespace describe --namespace default || temporal operator namespace create --namespace default --retention 72h
    mem_limit: 256m

  temporal-ui:
    image: temporalio/ui:2.58.1@sha256:ac3c13eddb4547d830991bb5eee93a5d97140134522b7297fdb2be1fe25ef925
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:${WEBCHAT_TEMPORAL_UI_PORT:-18080}
    ports:
      - "127.0.0.1:${WEBCHAT_TEMPORAL_UI_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
