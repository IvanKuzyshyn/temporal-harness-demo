name: CI
on:
  push:
    branches: ['stack/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HARNESS_MODEL: mock
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Assert mock model for tests
        run: test "$HARNESS_MODEL" = mock
      - name: Validate tool installations
        run: |
          go version
          temporal --version
          ollama --version
      - run: go build ./...
      - run: go vet ./...
      # Bound process-heavy fixture concurrency on small runners.
      - run: go test -race -p 1 ./...
      - name: Live isolated Temporal durability (mock)
        run: scripts/test-integration.sh
      - name: Live isolated Temporal durability (race)
        run: scripts/test-integration.sh -race
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal scripts 2>/dev/null)"
