name: CI
on:
  push:
    branches: ['stack/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Validate pinned tools
        run: |
          go version
          temporal --version
          node --version
          pnpm --version
          python3 --version
          docker info
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -p 1 ./...
      - name: Lifecycle failure, locking and real process ownership
        run: bash scripts/dev/tests/lifecycle_test.sh
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web build
      - name: Real isolated web durability, parser, child and context boundaries
        # Full set, including canonical/preview regressions; no failure whitelist.
        env:
          WEBCHAT_TEST_CHAT_RUN: '.'
        run: scripts/test-web-integration.sh context
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal scripts 2>/dev/null)"
